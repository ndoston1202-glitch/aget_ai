name: Windows .exe va Android .apk yasash

on:
  push:
    branches: [main, claude/ai-agent]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Versiya raqamini yozish
        shell: bash
        run: echo "BUILD_SHA = \"$GITHUB_SHA\"" > agent/_version.py

      - name: .exe yasash
        run: >
          pyinstaller --noconfirm --onefile --windowed --name aget_ai
          --collect-submodules agent
          --collect-submodules google.genai
          gui.py

      - name: .exe ishga tushishini tekshirish
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\aget_ai.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest xato: $($p.ExitCode)" }

      - name: O'zini qayta ishga tushirish sinovi (yangilanishdagidek)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "restart_ok.txt"
          Start-Process -FilePath dist\aget_ai.exe -ArgumentList "--spawn-test", $marker -Wait
          for ($i = 0; $i -lt 30 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw "Qayta ishga tushgan nusxa ishlamadi" }
          Write-Host "Qayta ishga tushish ishladi"

      - name: O'rnatish sinovi (C:\AI Agent va yorliqlar)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "install_ok.txt"
          Start-Process -FilePath dist\aget_ai.exe -ArgumentList "--install-silent", "--write-marker", $marker -Wait
          for ($i = 0; $i -lt 30 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw "O'rnatilgan nusxa ishga tushmadi" }
          $c = Get-Content $marker -Raw
          Write-Host "Natija: $c"
          if (-not $c.StartsWith("True")) { throw "Dastur o'zini o'rnatilgan deb bilmadi" }
          if (-not (Test-Path "C:\AI Agent\aget_ai.exe")) { throw "C:\AI Agent\aget_ai.exe yo'q" }
          $desk = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path (Join-Path $desk 'AI Agent.lnk'))) { throw "Ish stolida yorliq yo'q" }
          Write-Host "O'rnatish ishladi"

      - uses: actions/upload-artifact@v4
        with:
          name: aget_ai-exe
          path: dist/aget_ai.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: .apk yasash
        run: gradle -p android assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - name: Nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aget_ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aget_ai-apk
          path: aget_ai.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: "\"latest\" relizga yuklash"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aget_ai.exe aget_ai.apk \
            --title "aget_ai (eng so'nggi versiya)" \
            --notes "Kompyuter: aget_ai.exe ni yuklab, ikki marta bosing. Windows ogohlantirsa: 'Подробнее' -> 'Выполнить в любом случае'. Telefon: aget_ai.apk ni yuklab o'rnating (noma'lum manbalarga ruxsat bering)." \
            --target "$GITHUB_SHA"
